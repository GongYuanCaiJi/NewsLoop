name: 功能建議
description: 提議一個有明確使用情境的改善
title: "[Enhancement] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 請先描述使用者目前被什麼阻擋，不要只描述解法。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望達成的結果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方式
