name: Bug 回報
description: 回報可重現的錯誤
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 安全弱點請勿使用此表單，請改看 SECURITY.md。
  - type: textarea
    id: observed
    attributes:
      label: 實際行為
      description: 發生了什麼？請移除 tokens、database IDs 與個人資料。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重現步驟
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: NewsLoop commit
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: macOS 版本、Python 版本、瀏覽器版本
    validations:
      required: true
