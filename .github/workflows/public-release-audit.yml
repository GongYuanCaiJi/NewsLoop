name: Public Release Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Public release history and tree audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Audit public release ref
        run: python3 scripts/check_public_release.py HEAD
