name: Public Release Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Public release history and tree audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit public release ref
        run: python3 scripts/check_public_release.py HEAD
